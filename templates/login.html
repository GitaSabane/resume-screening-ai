<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ResumeAI</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .password-wrapper {
            position: relative;
        }
        .password-wrapper input {
            padding-right: 40px;
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #94a3b8;
            background: none;
            border: none;
            font-size: 1.1rem;
        }
        .toggle-password:hover {
            color: #1e293b;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <i class="fas fa-robot"></i> ResumeAI
            </div>
            <h2>Welcome Back</h2>
            <p class="auth-subtitle">Log in to your account to continue.</p>
            {% if error %}
                <div class="auth-error">{{ error|safe }}</div>
            {% endif %}
            <form method="POST" id="login-form" novalidate autocomplete="off">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="off" value="{{ request.form.email or '' }}">
                    <div class="field-error" id="email-error"></div>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="new-password">
                        <button type="button" class="toggle-password" id="toggle-login-password" aria-label="Toggle password visibility">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="field-error" id="password-error"></div>
                </div>
                <button type="submit" class="btn-primary btn-full">Log In</button>
            </form>
            <div class="auth-links">
                <p>Don't have an account? <a href="{{ url_for('register') }}">Create Account</a></p>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // === DISABLE BACK BUTTON ===
            window.history.pushState(null, null, window.location.href);
            window.addEventListener('popstate', function () {
                window.history.pushState(null, null, window.location.href);
            });

            // === CLEAR FORM FIELDS ON PAGE LOAD ===
            window.addEventListener('load', function() {
                document.getElementById('email').value = '';
                document.getElementById('password').value = '';
            });

            // === FORM VALIDATION ===
            const form = document.getElementById('login-form');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const emailError = document.getElementById('email-error');
            const passwordError = document.getElementById('password-error');

            form.addEventListener('submit', function(e) {
                let valid = true;
                emailError.textContent = '';
                passwordError.textContent = '';
                const email = emailInput.value.trim();
                const password = passwordInput.value.trim();

                if (!email) {
                    emailError.textContent = 'Please enter your email address.';
                    valid = false;
                } else if (!/^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Z|a-z]{2,}$/.test(email)) {
                    emailError.textContent = 'Please enter a valid email address.';
                    valid = false;
                }
                if (!password) {
                    passwordError.textContent = 'Please enter your password.';
                    valid = false;
                }
                if (!valid) {
                    e.preventDefault();
                }
            });

            // === TOGGLE PASSWORD VISIBILITY ===
            const toggleBtn = document.getElementById('toggle-login-password');
            toggleBtn.addEventListener('click', function() {
                const field = document.getElementById('password');
                const icon = this.querySelector('i');
                if (field.type === 'password') {
                    field.type = 'text';
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                } else {
                    field.type = 'password';
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                }
            });
        })();
    </script>
</body>
</html>
